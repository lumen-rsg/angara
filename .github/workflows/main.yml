# .github/workflows/main.yml

name: Continuous Build and Release

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: angara-linux-x64
            ext: so
          - os: macos-latest
            artifact: angara-macos-arm64
            ext: dylib

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux dependencies ──
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git clang cmake \
                                  llvm-dev libcurl4-openssl-dev libwebsockets-dev libssl-dev \
                                  libmosquitto-dev libcjson-dev libarchive-dev zlib1g-dev \
                                  libsqlite3-dev

      # Build & Install rabbitmq-c v0.14.0 from source (Linux)
      - name: Install rabbitmq-c v0.14.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch v0.14.0 https://github.com/alanxz/rabbitmq-c.git
          cd rabbitmq-c
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON \
                         -DRABBITMQ_C_BUILD_TESTS=OFF -DRABBITMQ_C_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build

      # ── macOS dependencies ──
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm pkg-config curl websockets openssl mosquitto cjson libarchive sqlite3

      # Build & Install rabbitmq-c v0.14.0 from source (macOS)
      - name: Install rabbitmq-c v0.14.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --branch v0.14.0 https://github.com/alanxz/rabbitmq-c.git
          cd rabbitmq-c
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON \
                         -DRABBITMQ_C_BUILD_TESTS=OFF -DRABBITMQ_C_BUILD_EXAMPLES=OFF
          cmake --build build -j$(sysctl -n hw.ncpu)
          sudo cmake --install build

      # ── Build ──
      - name: Build Compiler
        env:
          CC: clang
          CXX: clang++
          EXTRA_CXXFLAGS: -Werror -Wno-error=unused-parameter
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) all

      - name: Build Modules
        env:
          CC: clang
          CXX: clang++
          EXTRA_CXXFLAGS: -Werror -Wno-error=unused-parameter
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) modules

      # ── Test ──
      - name: Run Test Suite
        run: make test-ci

      - name: Run LLVM Backend Tests
        run: |
          for f in tests/llvm/*.an; do
            echo "Testing: $f"
            ./build/angc "$f" || exit 1
            base=$(basename "$f" .an)
            ./"$base" || exit 1
          done

      - name: Run Feature Tests
        run: |
          for f in tests/features/*.an; do
            echo "Testing: $f"
            ./build/angc "$f" || exit 1
            base=$(basename "$f" .an)
            ./"$base" || exit 1
          done

      # ── Stage artifacts (only on push to stable, not PRs) ──
      - name: Stage Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: |
          mkdir -p release_artifacts/modules
          cp build/angc release_artifacts/
          cp build/modules/*.${{ matrix.ext }} release_artifacts/modules/ 2>/dev/null || true

      - name: Archive Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        run: tar -czvf ${{ matrix.artifact }}.tar.gz -C release_artifacts .

      - name: Upload Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: angara-linux-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: angara-macos-arm64

      - name: Generate Release Tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d')-${{ github.sha }}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Angara Nightly ${{ env.TAG_NAME }}"
          body: |
            Automated build of Angara from commit `${{ github.sha }}`.

            **Includes:**
            - `angc` — Angara compiler (LLVM backend, self-contained)
            - `modules/` — Native modules (io, fs, os, path, time, json, http, websocket, amqp, mqtt, and more)

            **Platforms:**
            - `angara-linux-x64.tar.gz` — Linux x86_64
            - `angara-macos-arm64.tar.gz` — macOS Apple Silicon

            This is an unstable development build.
          draft: false
          prerelease: true
          files: |
            angara-linux-x64.tar.gz
            angara-macos-arm64.tar.gz

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git clang cmake \
                      llvm-dev libcurl4-openssl-dev libwebsockets-dev libssl-dev \
                      libmosquitto-dev libcjson-dev libarchive-dev zlib1g-dev \
                      libsqlite3-dev

      - name: Install rabbitmq-c v0.14.0
        run: |
          git clone --branch v0.14.0 https://github.com/alanxz/rabbitmq-c.git
          cd rabbitmq-c
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON \
                         -DRABBITMQ_C_BUILD_TESTS=OFF -DRABBITMQ_C_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Build with Sanitizers
        env:
          CC: clang
          CXX: clang++
          EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -Werror -Wno-error=unused-parameter
        run: make -j$(nproc) all

      - name: Build Modules with Sanitizers
        env:
          CC: clang
          CXX: clang++
          EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -Werror -Wno-error=unused-parameter
        run: make -j$(nproc) modules

      - name: Run Test Suite
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make test-ci
