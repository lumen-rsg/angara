# .github/workflows/ci_release.yml

name: Continuous Build and Release

# This workflow triggers on every push to the 'master' branch.
on:
  push:
    branches:
      - stable

jobs:
  build-and-release:
    # Use the latest stable Ubuntu runner provided by GitHub.
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Step 1: Check out the repository's source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install all required build dependencies for Angara.
      # Removed CMake since we are using pure Make now.
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git \
                                  clang make \
                                  libcurl4-openssl-dev libwebsockets-dev \
                                  libssl-dev librabbitmq-dev

      # Step 3: Build Project using the new Makefile.
      # Using -j$(nproc) allows make to use all available CPU cores for faster builds.
      - name: Build Project
        env:
          CC: clang
          CXX: clang++
        run: make -j$(nproc) all

      # Step 4: Prepare artifacts for release.
      # Paths are updated to reflect the new Makefile structure.
      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts/lib
          mkdir -p release_artifacts/modules
          mkdir -p release_artifacts/runtime
          
          # Copy the main executables
          cp build/angc release_artifacts/
          cp build/angara_ls release_artifacts/
          
          # Copy the core runtime library (Outputs to build/ now instead of build/lib/)
          cp build/libangara_runtime.so release_artifacts/lib/
          
          # Copy all the native module libraries (Outputs to build/modules/ now)
          cp build/modules/*.so release_artifacts/modules/
          
          # Copy runtime headers/source
          cp runtime/angara_runtime.* release_artifacts/runtime/

      # Step 5: Archive the staged artifacts into a single .tar.gz file.
      - name: Archive Release
        run: |
          tar -czvf angara-linux-amd64.tar.gz -C release_artifacts .

      # Step 6: Create a new GitHub Release.
      # The release will be tagged with the date and the short commit hash.
      - name: Generate Release Tag
        id: generate_tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d')-${{ github.sha }}" >> $GITHUB_ENV

      # Step 7: Create a new GitHub Release using the generated tag.
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the output from the previous step as the tag name.
          tag_name: ${{ env.TAG_NAME }}
          release_name: Angara Nightly Build ${{ github.sha }}
          body: |
            Automated build of Angara from commit ${{ github.sha }}.
            This is an unstable development build.
          draft: false
          prerelease: true

      # Step 8: Upload the archived build to the release.
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./angara-linux-amd64.tar.gz
          asset_name: angara-linux-amd64.tar.gz
          asset_content_type: application/gzip
