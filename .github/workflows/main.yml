# .github/workflows/ci_release.yml

name: Continuous Build and Release

on:
  push:
    branches:
      - stable

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install core dependencies
      # (Added cmake back so we can build rabbitmq-c from source; removed librabbitmq-dev)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git clang cmake \
                                  libcurl4-openssl-dev libwebsockets-dev libssl-dev

      # Step 3: Build & Install rabbitmq-c v0.14.0 from source
      # We install it to /usr so pkg-config and clang find it natively on Linux.
      - name: Install latest rabbitmq-c (v0.14.0)
        run: |
          git clone --branch v0.14.0 https://github.com/alanxz/rabbitmq-c.git
          cd rabbitmq-c
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON \
                         -DRABBITMQ_C_BUILD_TESTS=OFF -DRABBITMQ_C_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build

      # Step 4: Build Project using Makefile
      - name: Build Project
        env:
          CC: clang
          CXX: clang++
        run: make -j$(nproc) all

      # Step 5: Prepare artifacts for release
      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts/lib
          mkdir -p release_artifacts/modules
          mkdir -p release_artifacts/runtime
          
          # Copy the main executables
          cp build/angc release_artifacts/
          cp build/angara_ls release_artifacts/
          
          # Copy the core runtime library
          cp build/libangara_runtime.so release_artifacts/lib/
          
          # Copy all the native module libraries
          cp build/modules/*.so release_artifacts/modules/
          
          # Copy runtime headers/source
          cp runtime/angara_runtime.* release_artifacts/runtime/

      # Step 6: Archive the staged artifacts
      - name: Archive Release
        run: |
          tar -czvf angara-linux-amd64.tar.gz -C release_artifacts .

      # Step 7: Generate a Tag
      - name: Generate Release Tag
        id: generate_tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d')-${{ github.sha }}" >> $GITHUB_ENV

      # Step 8: Create the GitHub Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: Angara Nightly Build ${{ github.sha }}
          body: |
            Automated build of Angara from commit ${{ github.sha }}.
            This is an unstable development build.
          draft: false
          prerelease: true

      # Step 9: Upload the Tarball
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./angara-linux-amd64.tar.gz
          asset_name: angara-linux-amd64.tar.gz
          asset_content_type: application/gzip
