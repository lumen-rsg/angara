# .github/workflows/main.yml

name: Continuous Build and Release

on:
  push:
    branches:
      - stable

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install core dependencies (LLVM, curl, websockets, rabbitmq-c)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git clang cmake \
                                  llvm-dev libcurl4-openssl-dev libwebsockets-dev libssl-dev

      # Build & Install rabbitmq-c v0.14.0 from source
      - name: Install rabbitmq-c (v0.14.0)
        run: |
          git clone --branch v0.14.0 https://github.com/alanxz/rabbitmq-c.git
          cd rabbitmq-c
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON \
                         -DRABBITMQ_C_BUILD_TESTS=OFF -DRABBITMQ_C_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build

      # Build the Angara compiler (LLVM backend, self-contained, no C runtime)
      - name: Build Compiler
        env:
          CC: clang
          CXX: clang++
        run: make -j$(nproc) all

      # Build all native modules (io, fs, json, http, websocket, amqp, etc.)
      - name: Build Modules
        env:
          CC: clang
          CXX: clang++
        run: make -j$(nproc) modules

      # Stage all release artifacts
      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts/modules

          # Main compiler executable
          cp build/angc release_artifacts/

          # All native module shared libraries
          cp build/modules/*.so release_artifacts/modules/

      # Archive the staged artifacts
      - name: Archive Release
        run: tar -czvf angara-linux-x64.tar.gz -C release_artifacts .

      # Generate a date-based tag
      - name: Generate Release Tag
        id: generate_tag
        run: echo "TAG_NAME=v$(date +'%Y.%m.%d')-${{ github.sha }}" >> $GITHUB_ENV

      # Create GitHub Release with the tarball
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Angara Nightly ${{ env.TAG_NAME }}"
          body: |
            Automated build of Angara from commit `${{ github.sha }}`.

            **Includes:**
            - `angc` — Angara compiler (LLVM backend, self-contained)
            - `modules/*.so` — 12 native modules (io, fs, os, path, time, uuid, assert, adv_string, json, http, websocket, amqp)

            This is an unstable development build.
          draft: false
          prerelease: true
          files: angara-linux-x64.tar.gz